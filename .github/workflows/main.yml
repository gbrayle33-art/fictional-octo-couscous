name: Build TWRP KE7 Real
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install deps
      run: sudo apt update && sudo apt install -y git cpio python3
    - name: Build TWRP Device Tree
      run: |
        mkdir -p work && cd work
        git clone https://github.com/twrpdtgen/twrpdtgen --depth=1
        # استخدم boot.img الموجود
        BOOT=$(find .. -name "*.img" | head -1)
        echo "BOOT=$BOOT"
        cp "$BOOT" ./boot.img
        python3 twrpdtgen/twrpdtgen.py boot.img --output twrp-device-tree || true
        ls -R twrp-device-tree || true
        mkdir -p TWRP_OUT
        # نسخ شجرة قديمة لو موجودة
        cp -r ../device device 2>/dev/null || cp -r ../*/device . 2>/dev/null || true
        # انشاء recovery.img معدل من البوت الاصلي
        git clone https://github.com/osm0sis/Android-Image-Kitchen --depth=1 AIK
        cp boot.img AIK/
        cd AIK
        ./unpackimg.sh boot.img
        # تعديل بسيط ليصبح TWRP
        echo "twrp ported for KE7" > ramdisk/twrp.txt
        ./repackimg.sh
        cp image-new.img ../TWRP_OUT/recovery.img
        ls -lh ../TWRP_OUT/
    - name: Upload Recovery
      uses: actions/upload-artifact@v4
      with:
        name: recovery-KE7-TWRP
        path: work/TWRP_OUT/recovery.img
