name: Build TWRP V472
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install repo
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Build
        run: |
          mkdir ~/twrp && cd ~/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -j2
          
          # لو لقي الـ zip يفكه اوتوماتيك
          if [ -f "$GITHUB_WORKSPACE/KE7-tree.zip" ]; then
            unzip -o $GITHUB_WORKSPACE/KE7-tree.zip -d /tmp/ke7
            mkdir -p device/infinix/KE7
            cp -r /tmp/ke7/* device/infinix/KE7/ 2>/dev/null || cp -r /tmp/ke7/device/infinix/KE7/* device/infinix/KE7/
          else
            cp -r $GITHUB_WORKSPACE/* device/infinix/KE7/ || true
          fi
          
          . build/envsetup.sh
          lunch twrp_KE7-eng || lunch omni_KE7-eng
          mka recoveryimage -j4

      - uses: actions/upload-artifact@v4
        with:
          name: recovery-KE7-V472
          path: ~/twrp/out/target/product/KE7/recovery.img
