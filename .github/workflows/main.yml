name: Build TWRP V472
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sudo apt update && sudo apt install -y git
          mkdir ~/twrp && cd ~/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -j4
          cp -r $GITHUB_WORKSPACE/* device/infinix/KE7/
          . build/envsetup.sh
          lunch twrp_KE7-eng
          mka recoveryimage
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-V472
          path: ~/twrp/out/target/product/KE7/recovery.img
