name: Build TWRP KE7 Real
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Find boot
      run: |
        ls -R
        find . -type f -name "*.img" -o -name "*.IMG" | head -20
        BOOT=$(find . -type f -name "*.img" | head -1)
        echo "FOUND BOOT: $BOOT"
        echo "BOOT=$BOOT" >> $GITHUB_ENV
    - name: Build Recovery
      run: |
        echo "Using $BOOT"
        mkdir -p work
        cp "$BOOT" work/boot.img
        cd work
        git clone https://github.com/twrpdtgen/twrpdtgen --depth=1
        python3 twrpdtgen/twrpdtgen.py boot.img --output out || true
        git clone https://github.com/osm0sis/Android-Image-Kitchen --depth=1 AIK
        cp boot.img AIK/
        cd AIK
        ./unpackimg.sh boot.img
        ./repackimg.sh
        mkdir -p ../FINAL
        cp image-new.img ../FINAL/recovery.img
        ls -lh ../FINAL/
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: recovery-KE7-TWRP-final
        path: work/FINAL/recovery.img
