name: Build TWRP V472 Final
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install repo
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH
          sudo apt install -y unzip

      - name: Build
        run: |
          echo "=== ايه اللي موجود في الريبو؟ ==="
          ls -la $GITHUB_WORKSPACE/
          find $GITHUB_WORKSPACE -maxdepth 4 -name "*.mk" | head -20

          mkdir ~/twrp && cd ~/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -j2 --force-sync

          echo "=== بندور على BoardConfig.mk ==="
          BOARD=$(find $GITHUB_WORKSPACE -name "BoardConfig.mk" | head -1)
          if [ -z "$BOARD" ]; then
            # جرب يفك اي zip
            for z in $GITHUB_WORKSPACE/*.zip $GITHUB_WORKSPACE/**/*.zip; do
              [ -f "$z" ] && unzip -o "$z" -d /tmp/ke7
            done
            BOARD=$(find /tmp/ke7 $GITHUB_WORKSPACE -name "BoardConfig.mk" | head -1)
          fi
          
          echo "لقيناه في: $BOARD"
          DEV_DIR=$(dirname "$BOARD")
          mkdir -p ~/twrp/device/infinix/KE7
          cp -rv $DEV_DIR/* ~/twrp/device/infinix/KE7/
          
          echo "=== اصلاح الـ Theme ==="
          grep -q "TW_THEME" ~/twrp/device/infinix/KE7/BoardConfig.mk || echo "TW_THEME := portrait_hdpi" >> ~/twrp/device/infinix/KE7/BoardConfig.mk
          
          ls ~/twrp/device/infinix/KE7/

          . build/envsetup.sh
          lunch twrp_KE7-eng
          mka recoveryimage -j4

      - uses: actions/upload-artifact@v4
        with:
          name: recovery-KE7-V472-FINAL
          path: ~/twrp/out/target/product/KE7/recovery.img
