name: Build TWRP V472
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install repo
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH
          sudo apt install -y unzip

      - name: Build
        run: |
          mkdir ~/twrp && cd ~/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -j2 --force-sync
          
          echo "== فك الشجرة =="
          ls $GITHUB_WORKSPACE/*.zip
          rm -rf /tmp/ke7 && mkdir /tmp/ke7
          unzip -o $GITHUB_WORKSPACE/KE7-tree.zip -d /tmp/ke7 || unzip -o $GITHUB_WORKSPACE/*.zip -d /tmp/ke7
          DEV_DIR=$(find /tmp/ke7 -name "BoardConfig.mk" -print | head -1 | xargs dirname)
          echo "DEV_DIR=$DEV_DIR"
          mkdir -p ~/twrp/device/infinix/KE7
          cp -rv $DEV_DIR/* ~/twrp/device/infinix/KE7/
          
          echo "== اصلاح Theme =="
          if ! grep -q "TW_THEME" ~/twrp/device/infinix/KE7/BoardConfig.mk; then
            echo "TW_THEME := portrait_hdpi" >> ~/twrp/device/infinix/KE7/BoardConfig.mk
          fi
          
          ls ~/twrp/device/infinix/KE7/
          
          . build/envsetup.sh
          lunch twrp_KE7-eng
          mka recoveryimage -j4

      - uses: actions/upload-artifact@v4
        with:
          name: recovery-KE7-V472
          path: ~/twrp/out/target/product/KE7/recovery.img
