name: Build TWRP KE7 Final
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Sync TWRP minimal
      run: |
        mkdir -p ~/twrp && cd ~/twrp
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1 --depth=1
        repo sync -j8 --force-sync
        cp -r $GITHUB_WORKSPACE/device device/Infinix/KE7 || true
        ls device/Infinix/KE7
    - name: Build recovery.img
      run: |
        cd ~/twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        . build/envsetup.sh
        lunch twrp_KE7-eng || lunch aosp_arm64-eng
        mka recoveryimage -j8 || make recoveryimage -j8
        find out -name recovery.img -o -name boot.img | head -20
    - name: Upload final
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-KE7-final
        path: ~/twrp/out/target/product/*/recovery.img
