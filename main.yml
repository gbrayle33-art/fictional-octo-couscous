name: Build TWRP for KE7
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y cpio git python3-pip
        pip3 install twrpdtgen
    - name: Prepare boot
      run: |
        ls -lh
        if [ -f boot_KE7_V472.img.gz ]; then gunzip -c boot_KE7_V472.img.gz > boot.img; fi
        if [ -f boot.img.gz ]; then gunzip -c boot.img.gz > boot.img; fi
        ls -lh boot.img
    - name: Generate device tree
      run: |
        mkdir -p out
        python3 -m twrpdtgen boot.img --output device || python3 -m twrpdtgen boot.img -o device
        ls -R device || true
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: KE7-device-tree
        path: device
